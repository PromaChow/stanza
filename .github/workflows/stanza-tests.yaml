name: Run Stanza Tests
on: [push]
jobs:
  Run-Stanza-Tests:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      
      - name: Check out repository code
        uses: actions/checkout@v2
      
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-activate-base: false
          activate-environment: stanza
          environment-file: environment.yml
          python-version: '3.9'
          auto-update-conda: true
      
      - name: Run Stanza Tests
        shell: bash -l {0}
        run: |
          # set up environment
          echo "Setting up environment..."
          
          # Set environment variables
          export STANZA_TEST_HOME=$HOME/stanza_test
          export CORENLP_HOME=$STANZA_TEST_HOME/corenlp_dir
          export CLASSPATH=$CORENLP_HOME/*:
          echo "CORENLP_HOME=$CORENLP_HOME"
          echo "CLASSPATH=$CLASSPATH"
          
          # install from stanza repo being evaluated
          echo "PWD: $(pwd)"
          echo "PATH: $PATH"
          pip3 install -e .
          pip3 install -e .[test]
          pip3 install -e .[transformers]
          pip3 install -e .[tokenizers]
          
          # set up for tests
          echo "Running stanza test set up..."
          rm -rf $STANZA_TEST_HOME
          python3 stanza/tests/setup.py
          
          # run tests
          echo "Running tests..."
          export CUDA_VISIBLE_DEVICES=2
          pytest stanza/tests
        continue-on-error: true
          
      - run: echo "🍏 This job's status is ${{ job.status }}."